name: Deploy to Vercel

on:
  push:
    branches:
      - main   # change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: cd bioblitz && npm ci

      - name: Install Vercel CLI
        run: cd bioblitz && npm install -g vercel

      - name: Pull Vercel environment
        run: cd bioblitz && vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: cd bioblitz && vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: cd bioblitz && vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}