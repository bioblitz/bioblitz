name: CI + Deploy

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Deploy if build passes
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"